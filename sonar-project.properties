sonar.projectKey=xtremeiptv_xtreme-iptv
sonar.organization=xtremeiptv
sonar.host.url=https://sonarcloud.io

sonar.sources=.
sonar.exclusions=**/*.kt,**/*.java
sonar.tests=src/test/java,src/androidTest/java

sonar.java.binaries=app/build/intermediates/javac/debug/classes
sonar.kotlin.binaries=app/build/tmp/kotlin-classes/debug

sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml
sonar.detekt.reportPaths=build/reports/detekt/detekt.xml
