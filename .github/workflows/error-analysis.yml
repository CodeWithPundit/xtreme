name: Error Analysis & Debug Helper

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Manual trigger

jobs:
  comprehensive-analysis:
    name: 🔍 Comprehensive Error Analysis
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        api-level: [29, 30, 31, 32, 33, 34]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Clean Build (with stacktrace)
        id: clean_build
        continue-on-error: true
        run: |
          ./gradlew clean --stacktrace > clean_log.txt 2>&1 || true
          echo "CLEAN_EXIT_CODE=$?" >> $GITHUB_OUTPUT
      
      - name: Compile Debug (with all warnings)
        id: compile_debug
        continue-on-error: true
        run: |
          ./gradlew compileDebugSources --stacktrace --warning-mode=all > compile_log.txt 2>&1 || true
          echo "COMPILE_EXIT_CODE=$?" >> $GITHUB_OUTPUT
      
      - name: Kotlin Compilation Analysis
        id: kotlin_analysis
        continue-on-error: true
        run: |
          ./gradlew kaptDebugKotlin --stacktrace > kapt_log.txt 2>&1 || true
          echo "KAPT_EXIT_CODE=$?" >> $GITHUB_OUTPUT
      
      - name: Run Detekt for Code Quality
        id: detekt
        continue-on-error: true
        run: |
          ./gradlew detekt --stacktrace > detekt_report.txt 2>&1 || true
          echo "DETEKT_EXIT_CODE=$?" >> $GITHUB_OUTPUT
      
      - name: Lint Analysis
        id: lint
        continue-on-error: true
        run: |
          ./gradlew lintDebug --stacktrace > lint_results.txt 2>&1 || true
          echo "LINT_EXIT_CODE=$?" >> $GITHUB_OUTPUT
      
      - name: Dependency Analysis
        id: dependencies
        continue-on-error: true
        run: |
          ./gradlew app:dependencies --configuration debugCompileClasspath > dependencies_tree.txt 2>&1 || true
          ./gradlew dependencyInsight --dependency "androidx.*" --configuration debugCompileClasspath > dependency_conflicts.txt 2>&1 || true
      
      - name: Unit Tests with Coverage
        id: tests
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest jacocoTestReport --stacktrace > test_results.txt 2>&1 || true
          echo "TEST_EXIT_CODE=$?" >> $GITHUB_OUTPUT
      
      - name: Build APK (Debug)
        id: build_apk
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --stacktrace > build_log.txt 2>&1 || true
          echo "BUILD_EXIT_CODE=$?" >> $GITHUB_OUTPUT
      
      - name: Generate Error Report
        id: error_report
        run: |
          echo "# 🚨 Xtreme IPTV - Error Analysis Report" > error_report.md
          echo "Generated: $(date)" >> error_report.md
          echo "" >> error_report.md
          
          # Check exit codes
          echo "## 📊 Build Status Overview" >> error_report.md
          echo "| Step | Status | Exit Code |" >> error_report.md
          echo "|------|--------|-----------|" >> error_report.md
          
          # Clean step
          if [ "${{ steps.clean_build.outputs.CLEAN_EXIT_CODE }}" == "0" ]; then
            echo "| Clean | ✅ Success | 0 |" >> error_report.md
          else
            echo "| Clean | ❌ Failed | ${{ steps.clean_build.outputs.CLEAN_EXIT_CODE }} |" >> error_report.md
          fi
          
          # Compile step
          if [ "${{ steps.compile_debug.outputs.COMPILE_EXIT_CODE }}" == "0" ]; then
            echo "| Compile | ✅ Success | 0 |" >> error_report.md
          else
            echo "| Compile | ❌ Failed | ${{ steps.compile_debug.outputs.COMPILE_EXIT_CODE }} |" >> error_report.md
          fi
          
          # KAPT step
          if [ "${{ steps.kotlin_analysis.outputs.KAPT_EXIT_CODE }}" == "0" ]; then
            echo "| KAPT | ✅ Success | 0 |" >> error_report.md
          else
            echo "| KAPT | ❌ Failed | ${{ steps.kotlin_analysis.outputs.KAPT_EXIT_CODE }} |" >> error_report.md
          fi
          
          # Detekt step
          if [ "${{ steps.detekt.outputs.DETEKT_EXIT_CODE }}" == "0" ]; then
            echo "| Detekt | ✅ Success | 0 |" >> error_report.md
          else
            echo "| Detekt | ❌ Failed | ${{ steps.detekt.outputs.DETEKT_EXIT_CODE }} |" >> error_report.md
          fi
          
          # Lint step
          if [ "${{ steps.lint.outputs.LINT_EXIT_CODE }}" == "0" ]; then
            echo "| Lint | ✅ Success | 0 |" >> error_report.md
          else
            echo "| Lint | ❌ Failed | ${{ steps.lint.outputs.LINT_EXIT_CODE }} |" >> error_report.md
          fi
          
          # Tests step
          if [ "${{ steps.tests.outputs.TEST_EXIT_CODE }}" == "0" ]; then
            echo "| Tests | ✅ Success | 0 |" >> error_report.md
          else
            echo "| Tests | ❌ Failed | ${{ steps.tests.outputs.TEST_EXIT_CODE }} |" >> error_report.md
          fi
          
          # Build step
          if [ "${{ steps.build_apk.outputs.BUILD_EXIT_CODE }}" == "0" ]; then
            echo "| Build APK | ✅ Success | 0 |" >> error_report.md
          else
            echo "| Build APK | ❌ Failed | ${{ steps.build_apk.outputs.BUILD_EXIT_CODE }} |" >> error_report.md
          fi
          
          echo "" >> error_report.md
      
      - name: Parse Compilation Errors
        if: steps.compile_debug.outputs.COMPILE_EXIT_CODE != '0'
        run: |
          echo "## 🔴 Compilation Errors" >> error_report.md
          echo '```' >> error_report.md
          grep -E "error:|unresolved reference|type mismatch|cannot infer|None of the following functions" compile_log.txt | head -20 >> error_report.md
          echo '```' >> error_report.md
          echo "" >> error_report.md
          
          # Count errors
          ERROR_COUNT=$(grep -c "error:" compile_log.txt || true)
          echo "**Total Compilation Errors:** $ERROR_COUNT" >> error_report.md
          echo "" >> error_report.md
          
          # Categorize errors
          echo "### 📋 Error Categories" >> error_report.md
          echo "" >> error_report.md
          
          # Missing imports
          MISSING_IMPORT=$(grep -c "unresolved reference" compile_log.txt || true)
          echo "- **Missing Imports:** $MISSING_IMPORT" >> error_report.md
          
          # Type mismatches
          TYPE_MISMATCH=$(grep -c "type mismatch" compile_log.txt || true)
          echo "- **Type Mismatches:** $TYPE_MISMATCH" >> error_report.md
          
          # Null safety
          NULL_SAFETY=$(grep -c "nullable.*return|null check" compile_log.txt || true)
          echo "- **Null Safety Issues:** $NULL_SAFETY" >> error_report.md
          
          # Function calls
          FUNC_ERRORS=$(grep -c "None of the following functions" compile_log.txt || true)
          echo "- **Function Call Errors:** $FUNC_ERRORS" >> error_report.md
          
          echo "" >> error_report.md
      
      - name: Parse KAPT Errors
        if: steps.kotlin_analysis.outputs.KAPT_EXIT_CODE != '0'
        run: |
          echo "## 🔴 KAPT/Annotation Processing Errors" >> error_report.md
          echo '```' >> error_report.md
          grep -E "error:|failed|exception|not found" kapt_log.txt | head -20 >> error_report.md
          echo '```' >> error_report.md
          echo "" >> error_report.md
          
          # Hilt specific errors
          HILT_ERRORS=$(grep -c "dagger.hilt" kapt_log.txt || true)
          ROOM_ERRORS=$(grep -c "androidx.room" kapt_log.txt || true)
          
          echo "### 📋 KAPT Issues" >> error_report.md
          echo "- **Hilt Issues:** $HILT_ERRORS" >> error_report.md
          echo "- **Room Issues:** $ROOM_ERRORS" >> error_report.md
          echo "" >> error_report.md
      
      - name: Parse Lint Warnings
        if: steps.lint.outputs.LINT_EXIT_CODE != '0'
        run: |
          echo "## 🟡 Lint Warnings (Fix for better code)" >> error_report.md
          echo '```' >> error_report.md
          grep -E "warning:|WARNING" lint_results.txt | head -30 >> error_report.md
          echo '```' >> error_report.md
          echo "" >> error_report.md
          
          # Lint categories
          LINT_TOTAL=$(grep -c "warning:" lint_results.txt || true)
          echo "**Total Lint Warnings:** $LINT_TOTAL" >> error_report.md
          echo "" >> error_report.md
      
      - name: Parse Test Failures
        if: steps.tests.outputs.TEST_EXIT_CODE != '0'
        run: |
          echo "## 🔴 Test Failures" >> error_report.md
          echo '```' >> error_report.md
          grep -E "FAILED|AssertionError|Exception" test_results.txt | head -20 >> error_report.md
          echo '```' >> error_report.md
          echo "" >> error_report.md
          
          # Generate test report summary
          if [ -f "app/build/reports/tests/testDebugUnitTest/index.html" ]; then
            echo "📊 **Test Report:** Available as artifact" >> error_report.md
          fi
          echo "" >> error_report.md
      
      - name: Check Common Build Issues
        run: |
          echo "## 🛠️ Common Issue Checklist" >> error_report.md
          echo "" >> error_report.md
          
          # Check for missing modules in settings.gradle.kts
          if grep -q "include" settings.gradle.kts; then
            echo "✅ settings.gradle.kts has modules" >> error_report.md
          else
            echo "❌ settings.gradle.kts missing modules" >> error_report.md
          fi
          
          # Check for AndroidManifest.xml
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            echo "✅ AndroidManifest.xml exists" >> error_report.md
          else
            echo "❌ AndroidManifest.xml missing" >> error_report.md
          fi
          
          # Check for application class
          if grep -q "android:name=\".*Application\"" app/src/main/AndroidManifest.xml; then
            echo "✅ Application class declared" >> error_report.md
          else
            echo "❌ Application class missing in manifest" >> error_report.md
          fi
          
          # Check for Hilt
          if grep -q "hilt" "app/build.gradle.kts"; then
            echo "✅ Hilt configured" >> error_report.md
          else
            echo "❌ Hilt missing" >> error_report.md
          fi
          
          # Check for Room
          if grep -q "room" "app/build.gradle.kts"; then
            echo "✅ Room configured" >> error_report.md
          else
            echo "❌ Room missing" >> error_report.md
          fi
          
          # Check for Compose
          if grep -q "compose" "app/build.gradle.kts"; then
            echo "✅ Compose configured" >> error_report.md
          else
            echo "❌ Compose missing" >> error_report.md
          fi
          
          # Check for duplicate dependencies
          echo "" >> error_report.md
          echo "### 📦 Dependency Version Conflicts" >> error_report.md
          echo '```' >> error_report.md
          grep -E "Conflict|Multiple|duplicate" dependency_conflicts.txt 2>/dev/null | head -10 >> error_report.md || echo "No major conflicts found" >> error_report.md
          echo '```' >> error_report.md
          echo "" >> error_report.md
      
      - name: Generate Fix Suggestions
        run: |
          echo "## 💡 Automatic Fix Suggestions" >> error_report.md
          echo "" >> error_report.md
          
          # Parse errors and suggest fixes
          if [ -f "compile_log.txt" ]; then
            # Unresolved reference suggestions
            UNRESOLVED=$(grep "unresolved reference" compile_log.txt | head -5)
            if [ ! -z "$UNRESOLVED" ]; then
              echo "### 📌 Unresolved References" >> error_report.md
              echo "$UNRESOLVED" | while read line; do
                CLASS=$(echo "$line" | grep -o "unresolved reference [a-zA-Z0-9_.]*" | cut -d' ' -f3)
                if [ ! -z "$CLASS" ]; then
                  echo "- **$CLASS** - Try importing:" >> error_report.md
                  echo "  \`\`\`kotlin" >> error_report.md
                  echo "  import $CLASS" >> error_report.md
                  echo "  \`\`\`" >> error_report.md
                fi
              done
              echo "" >> error_report.md
            fi
            
            # Missing override suggestions
            OVERRIDE=$(grep "'[a-zA-Z0-9_]*' overrides nothing" compile_log.txt | head -3)
            if [ ! -z "$OVERRIDE" ]; then
              echo "### 📌 Override Issues" >> error_report.md
              echo "$OVERRIDE" >> error_report.md
              echo "🔧 **Fix:** Check parent class/supertype for correct method signature" >> error_report.md
              echo "" >> error_report.md
            fi
            
            # Type mismatch suggestions
            MISMATCH=$(grep "type mismatch" compile_log.txt | head -3)
            if [ ! -z "$MISMATCH" ]; then
              echo "### 📌 Type Mismatches" >> error_report.md
              echo "$MISMATCH" >> error_report.md
              echo "🔧 **Fix:** Check expected vs actual type, use `.toInt()`, `.toString()`, etc." >> error_report.md
              echo "" >> error_report.md
            fi
          fi
          
          # Gradle suggestions
          echo "### 📌 Gradle Fixes" >> error_report.md
          echo "- **Clean build:** \`./gradlew clean\`" >> error_report.md
          echo "- **Invalidate caches:** \`./gradlew clean --refresh-dependencies\`" >> error_report.md
          echo "- **Check dependencies:** \`./gradlew app:dependencies\`" >> error_report.md
          echo "" >> error_report.md
      
      - name: Upload Error Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: error-analysis-report-api-${{ matrix.api-level }}
          path: |
            error_report.md
            compile_log.txt
            kapt_log.txt
            lint_results.txt
            test_results.txt
            build_log.txt
            detekt_report.txt
            dependencies_tree.txt
            dependency_conflicts.txt
            app/build/reports/
          retention-days: 30
      
      - name: Create GitHub Issue on Failure
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('error_report.md', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Build Failed: Error Analysis Report - ${new Date().toLocaleDateString()}`,
              body: report.substring(0, 6000) + "\n\n... (truncated, see workflow artifacts for full report)",
              labels: ['build-failure', 'needs-review']
            });
      
      - name: Comment PR on Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('error_report.md', 'utf8');
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "## 🚨 Build Failed\n\n" + report.substring(0, 4000) + "\n\n📎 **Full report available in workflow artifacts**"
            });
      
      - name: Send Notification on Critical Failure
        if: failure() && (steps.compile_debug.outputs.COMPILE_EXIT_CODE != '0' || steps.build_apk.outputs.BUILD_EXIT_CODE != '0')
        uses: actions/actions-send-email@v1
        with:
          to: 'developer@xtremeiptv.com'
          from: 'ci@xtremeiptv.com'
          subject: '🚨 Critical Build Failure - Xtreme IPTV'
          body: 'Build failed. Check error report: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
